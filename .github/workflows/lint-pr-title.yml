name: Lint PR title

on:
  workflow_call:

# Ensures linting for a previous PR title will be completed before linting a modified title.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
    outputs:
      error_message: ${{ steps.lint.outputs.error_message }}

    steps:
      - uses: amannn/action-semantic-pull-request@v6
        id: lint
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # GITHUB_TOKEN of a PR from a fork is read-only, so it can't comment.
  report-pr-title-lint-error:
    if: ${{ always() && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: lint-pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: write

    steps:
      - uses: marocchino/sticky-pull-request-comment@v3
        if: ${{ needs.lint-pr-title.outputs.error_message != null }}
        with:
          header: pr-title-lint-error
          message: |
            Hey there and thank you for opening this pull request! 👋

            We require pull request titles to follow the [Conventional Commits specification](https://www.conventionalcommits.org/en/v1.0.0/) and it looks like your proposed title needs to be adjusted.

            Details:

            ```
            ${{ needs.lint-pr-title.outputs.error_message }}
            ```

      # Delete a previous comment when the issue has been resolved.
      - uses: marocchino/sticky-pull-request-comment@v3
        if: ${{ needs.lint-pr-title.outputs.error_message == null }}
        with:
          header: pr-title-lint-error
          delete: true
